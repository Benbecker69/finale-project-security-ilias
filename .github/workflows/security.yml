name: DevSecOps Security Pipeline

# Runs on every push and pull request. Performs application tests plus SAST, SCA,
# secret scanning and DAST. The build FAILS on a high/critical dependency issue,
# an ERROR-level SAST finding, or a detected secret.

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  # ---------------------------------------------------------------- Application tests
  app-tests:
    name: Application tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install & test backend
        working-directory: backend
        env:
          NODE_ENV: test
        run: |
          npm ci
          npm test
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  # ---------------------------------------------------------------- SAST (Semgrep)
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep (OWASP Top 10 + JS), block on ERROR-severity findings
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/javascript \
            --severity ERROR \
            --error \
            --sarif --output semgrep.sarif
      - name: Upload Semgrep SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif

  # ---------------------------------------------------------------- SCA (npm audit)
  sca:
    name: SCA (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Audit backend production dependencies (fail on high+)
        working-directory: backend
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
      - name: Audit frontend dependencies (report only)
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high || true

  # ---------------------------------------------------------------- Secret scanning (Gitleaks)
  secret-scan:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks (fails if a secret is detected)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------- DAST (OWASP ZAP baseline)
  dast:
    name: DAST (OWASP ZAP baseline)
    runs-on: ubuntu-latest
    needs: app-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Start the API
        working-directory: backend
        env:
          NODE_ENV: development
          JWT_SECRET: ci_ephemeral_secret_not_a_real_one
        run: |
          npm ci
          npm run seed
          (npm start &)
          npx --yes wait-on http://localhost:4000/api/health --timeout 60000
      - name: OWASP ZAP baseline scan (report only)
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:4000'
          fail_action: false
          allow_issue_writing: false
          cmd_options: '-a'
